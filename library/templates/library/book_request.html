{% extends 'library/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            📖 Request Book
        </h2>

        <h5>
            Book: {{ book.title }}
        </h5>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label>Name</label>
                <input type="text" 
                       name="name" 
                       class="form-control"
                       required>
            </div>


            <div class="mb-3">
                <label>Mobile</label>
                <input type="text" 
                       name="mobile" 
                       class="form-control"
                       required>
            </div>


            <div class="mb-3">
                <label>Email</label>
                <input type="email" 
                       name="email" 
                       class="form-control"
                       required>
            </div>


            <button class="btn btn-primary w-100">
                Submit Request
            </button>

        </form>

    </div>

</div>

{% endblock %}
