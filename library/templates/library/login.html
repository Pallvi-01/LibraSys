{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>LibraSys Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            height:100vh;
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            width:380px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:25px;
            color:#0d6efd;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border-radius:8px;
            border:1px solid #ddd;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#0d6efd;
            color:white;
            font-size:16px;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>📚 LibraSys</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">
        Login
    </button>

</form>

</div>

</body>
</html>
