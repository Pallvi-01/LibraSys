{% extends 'library/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">📚 Edit Book</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Book Title</label>
            <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
        </div>

        <div class="mb-3">
            <label>Author</label>
            <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input type="text" name="category" class="form-control" value="{{ book.category }}" required>
        </div>

        <div class="mb-3">
            <label>ISBN</label>
            <input type="text" name="isbn" class="form-control" value="{{ book.isbn }}" required>
        </div>

        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" name="quantity" class="form-control" value="{{ book.quantity }}" required>
        </div>

        <button class="btn btn-success">
            Update Book
        </button>

        <a href="{% url 'book_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
