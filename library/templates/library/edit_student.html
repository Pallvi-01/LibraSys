{% extends 'library/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">✏️ Edit Student</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
        </div>

        <div class="mb-3">
            <label>Roll Number</label>
            <input type="text" name="roll" class="form-control" value="{{ student.roll_number }}" required>
        </div>

        <div class="mb-3">
            <label>Course</label>
            <input type="text" name="course" class="form-control" value="{{ student.course }}" required>
        </div>

        <div class="mb-3">
            <label>Mobile</label>
            <input type="text" name="mobile" class="form-control" value="{{ student.mobile }}" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
        </div>

        <button class="btn btn-success">
            Update Student
        </button>

        <a href="{% url 'student_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
